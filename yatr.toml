# yatr - https://github.com/cargopete/yatr
#
# These tasks are what .github/workflows CI runs, command for command, so
# `yatr ci` locally is the same gate. The workflow calls these tasks by name:
# change a command here and CI changes with it.
#
# The aggregate is `ci`, not `check`: `yatr check` is a builtin that validates
# this file and shadows any task of that name without warning.

[env]
CARGO_TERM_COLOR = "always"

[settings]
cache = true

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted (CI: fmt-clippy)"
run = ["cargo fmt --all -- --check"]
sources = ["**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied (CI: fmt-clippy)"
run = ["cargo clippy --workspace -- -D warnings"]
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.test]
desc = "Run the test suite (CI: test)"
run = ["cargo test --workspace"]
sources = ["**/*.rs", "**/Cargo.toml"]
watch = ["**/*.rs"]

[tasks.build]
desc = "Build in release mode"
run = ["cargo build --workspace --release"]
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.doc]
desc = "Build the API docs"
run = ["cargo doc --workspace --no-deps"]
sources = ["**/*.rs"]

[tasks.wasm]
desc = "Build the example subgraphs to WASM (CI: build-wasm; needs wasm-opt)"
run = ["./build-wasm.sh"]
no_cache = true

[tasks.ci]
desc = "What the CI test and fmt-clippy jobs run: fmt-check, lint, test"
depends = ["fmt-check", "lint", "test"]
run = []
